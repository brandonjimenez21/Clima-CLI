name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Verify dependencies
        run: go mod verify

      - name: Download modules explicitly
        run: go mod download

      - name: Run go fmt
        run: if [ "$(go fmt ./... | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Run go vet
        run: go vet -mod=mod ./...

      - name: Run tests
        run: go test -v ./...

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t clima-cli:1.0 .
