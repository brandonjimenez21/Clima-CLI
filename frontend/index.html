<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="default">
    <div id="weather-bg"></div>
    <div id="app">
        <div class="container">
            <header>
                <div class="status-indicator"></div>
                <p class="subtitle">Weather Monitor</p>
            </header>

            <div class="search-box">
                <input type="text" id="city-input" placeholder="Buscar ubicación..." autocomplete="off">
                <button id="favorite-btn" title="Guardar favorito" class="minimal-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                </button>
                <button id="search-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>

            <div id="favorites-list" class="favorites-bar"></div>

            <div id="loader" class="hidden">
                <div class="minimal-loader"></div>
            </div>

            <div id="weather-result" class="hidden">
                <div class="weather-content">
                    <div class="main-display">
                        <h1 id="city-name">--</h1>
                        <div class="temp-wrap">
                            <span id="temp">--</span><span class="symbol">°</span>
                        </div>
                        <p id="description"></p>
                    </div>
                    
                    <div class="data-grid">
                        <div class="data-cell">
                            <span class="label">Sensación</span>
                            <span id="feels-like" class="value">--°C</span>
                        </div>
                        <div class="data-cell">
                            <span class="label">Humedad</span>
                            <span id="humidity" class="value">--%</span>
                        </div>
                        <div class="data-cell">
                            <span class="label">Viento</span>
                            <span id="wind" class="value">-- m/s</span>
                        </div>
                        <div class="data-cell">
                            <span class="label">Lluvia</span>
                            <span id="rain-prob" class="value">--%</span>
                        </div>
                    </div>

                    <div class="sun-cycle">
                        <div class="sun-item">
                            <span class="label">Amanecer</span>
                            <span id="sunrise" class="value">--:--</span>
                        </div>
                        <div class="sun-item">
                            <span class="label">Atardecer</span>
                            <span id="sunset" class="value">--:--</span>
                        </div>
                    </div>

                    <div class="forecast-container">
                        <p class="forecast-title">Próximas 24 horas</p>
                        <div id="chart-container" class="chart-container">
                            <!-- Los bares se generarán dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>

            <div id="error-msg" class="hidden"></div>
        </div>
    </div>

    <script src="/wails/ipc.js"></script>
    <script src="/wails/runtime.js"></script>
    <script src="main.js"></script>
</body>
</html>
